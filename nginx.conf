server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 모든 응답에 적용되는 보안 헤더.
    # add_header는 location 블록 안에서 다시 선언하면 상속이 끊기므로 server 레벨에 두고,
    # 캐시 location에서도 동일 set이 유효하도록 always 플래그를 사용한다.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: VitePress가 인라인 스크립트/스타일을 일부 사용하므로 'self' + 'unsafe-inline' 허용.
    # 인라인 의존성을 제거할 수 있으면 'unsafe-inline'를 빼고 hash/nonce로 좁히는 게 다음 단계.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.hong-ik.dev; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
}
